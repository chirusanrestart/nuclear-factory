name: Build mod

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android build tools
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'
      - name: Generate ore sprites
        run: python3 tools/generate_sprites.py
      - name: Build Android and desktop mod JAR
        run: gradle deploy --no-daemon
      - name: Verify mod entrypoint and Android dex in JAR
        shell: bash
        run: |
          set -euo pipefail

          JAR_FILE="build/libs/NuclearFactory.jar"
          test -f "$JAR_FILE" || {
            echo "::error::NuclearFactory.jar was not produced."
            exit 1
          }

          jar tf "$JAR_FILE" > build/jar-contents.txt
          for ENTRY in "mod.hjson" "nuclearfactory/NuclearFactoryMod.class" "classes.dex"; do
            grep -Fxq "$ENTRY" build/jar-contents.txt || {
              echo "::error::$ENTRY is missing from $JAR_FILE."
              echo "JAR contents:"
              cat build/jar-contents.txt
              exit 1
            }
          done

          echo "Verified desktop class, Android dex, and mod metadata in $JAR_FILE"
      - name: Upload JAR
        uses: actions/upload-artifact@v7
        with:
          name: NuclearFactory-Android
          path: build/libs/NuclearFactory.jar
