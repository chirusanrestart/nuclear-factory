name: Build mod

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Generate ore sprites
        run: python3 tools/generate_sprites.py
      - name: Build mod
        run: gradle build --no-daemon
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: NuclearFactory
          path: build/libs/*.jar
