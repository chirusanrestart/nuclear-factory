plugins {
    id 'java'
}

group = 'nuclearfactory'
version = '0.1.0'

repositories {
    mavenCentral()
    maven { url 'https://jitpack.io' }
}

dependencies {
    compileOnly 'com.github.Anuken.Mindustry:core:v160'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

def desktopJarFile = layout.buildDirectory.file('libs/NuclearFactoryDesktop.jar')
def androidJarFile = layout.buildDirectory.file('libs/NuclearFactoryAndroid.jar')

jar {
    archiveFileName = 'NuclearFactoryDesktop.jar'
    from('mod.hjson')
    from('sprites') {
        into 'sprites'
    }
}

tasks.register('jarAndroid') {
    dependsOn tasks.named('jar')
    outputs.file(androidJarFile)

    doLast {
        def sdkRoot = System.getenv('ANDROID_HOME') ?: System.getenv('ANDROID_SDK_ROOT')
        if (!sdkRoot) {
            throw new GradleException('Android SDK not found. Set ANDROID_HOME or ANDROID_SDK_ROOT.')
        }

        def sdkDir = new File(sdkRoot)
        def platformsDir = new File(sdkDir, 'platforms')
        def platform = platformsDir.listFiles()?.findAll { new File(it, 'android.jar').isFile() }?.max { a, b ->
            a.name <=> b.name
        }
        if (!platform) {
            throw new GradleException("No Android platform with android.jar found in ${platformsDir}.")
        }

        def buildToolsDir = new File(sdkDir, 'build-tools')
        def buildTools = buildToolsDir.listFiles()?.findAll { new File(it, 'd8').isFile() }?.max { a, b ->
            a.name <=> b.name
        }
        if (!buildTools) {
            throw new GradleException("D8 was not found in ${buildToolsDir}.")
        }

        def d8 = new File(buildTools, 'd8')
        def classpath = (configurations.compileClasspath.files + configurations.runtimeClasspath.files + [new File(platform, 'android.jar')]).unique()
        def command = [d8.absolutePath]
        classpath.each { dependency ->
            command.add('--classpath')
            command.add(dependency.absolutePath)
        }
        command.addAll([
            '--min-api', '21',
            '--output', androidJarFile.get().asFile.absolutePath,
            desktopJarFile.get().asFile.absolutePath
        ])

        def process = new ProcessBuilder(command)
            .directory(layout.buildDirectory.dir('libs').get().asFile)
            .inheritIO()
            .start()
        def exitCode = process.waitFor()
        if (exitCode != 0) {
            throw new GradleException("D8 failed with exit code ${exitCode}.")
        }
    }
}

tasks.register('deploy', Jar) {
    dependsOn tasks.named('jarAndroid')
    archiveFileName = 'NuclearFactory.jar'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from {
        [zipTree(desktopJarFile.get().asFile), zipTree(androidJarFile.get().asFile)]
    }
}
